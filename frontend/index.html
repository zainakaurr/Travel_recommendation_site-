<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    body { font-family: sans-serif; padding: 20px; }
    #controls { margin-bottom: 10px; display: flex; gap: 10px; }
    input { padding: 8px; width: 200px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #0077cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #error { color: red; margin: 8px 0; }
    #map { height: 500px; border-radius: 8px; }
  </style>
</head>
<body>

  <div id="controls">
    <input id="origin" placeholder="Origin (lat,lng) e.g. 43.6,-79.3" />
    <input id="destination" placeholder="Destination (lat,lng) e.g. 45.4,-75.7" />
    <button onclick="search()">Search</button>
  </div>

  <div id="error"></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
